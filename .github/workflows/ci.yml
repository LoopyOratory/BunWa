name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Skip Puppeteer's Chromium download — same as README/Docker. Tests never
      # launch the bundled browser (WEBJS uses CHROME_PATH / a mounted Chrome).
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bun run lint

      - name: TypeScript type check
        run: bun run typecheck
